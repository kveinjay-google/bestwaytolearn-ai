<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="presentation">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a"/>
      <stop offset="55%" stop-color="#071c28"/>
      <stop offset="100%" stop-color="#092030"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.42)"/>
      <stop offset="70%" stop-color="rgba(34,211,238,0.08)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.22)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04121a" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#04121a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04121a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>
  <ellipse cx="1560" cy="480" rx="520" ry="380" fill="url(#glow)"/>

  <circle cx="1500" cy="500" r="220" fill="none" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" opacity="0.45"/>
  <circle cx="1500" cy="500" r="140" fill="none" stroke="rgba(34,211,238,0.55)" stroke-width="1" opacity="0.28"/>
  <rect x="0" y="0" width="960" height="1080" fill="url(#fade)"/>
