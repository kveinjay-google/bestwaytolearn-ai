<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="presentation">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#faf8ff"/>
      <stop offset="100%" stop-color="#f5f0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(147,51,234,0.42)"/>
      <stop offset="70%" stop-color="rgba(147,51,234,0.08)"/>
      <stop offset="100%" stop-color="rgba(147,51,234,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(147,51,234,0.22)"/>
      <stop offset="100%" stop-color="rgba(147,51,234,0)"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faf8ff" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#faf8ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#faf8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>
  <ellipse cx="1560" cy="480" rx="520" ry="380" fill="url(#glow)"/>

  <circle cx="1480" cy="420" r="280" fill="url(#glow)"/>
  <circle cx="1620" cy="560" r="180" fill="url(#glow2)" opacity="0.65"/>
  <circle cx="1380" cy="620" r="120" fill="none" stroke="rgba(147,51,234,0.55)" stroke-width="1.2" opacity="0.28"/>
  <ellipse cx="1700" cy="360" rx="200" ry="160" fill="rgba(192,132,252,0.12)"/>
  <rect x="0" y="0" width="960" height="1080" fill="url(#fade)"/>
</svg>
