<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="手机短信验证">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 4 · 手机短信验证</text>

  <!-- Apple form (left) -->
  <rect x="48" y="80" width="380" height="280" rx="8" fill="#ffffff"/>
  <text x="68" y="110" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">📱 Verify your phone number</text>
  <text x="68" y="132" fill="#6e6e73" font-size="11">Enter the code we sent to your phone.</text>

  <text x="68" y="170" fill="#1d1d1f" font-size="12" font-weight="600">Country/Region</text>
  <rect x="68" y="180" width="320" height="36" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="84" y="204" fill="#1d1d1f" font-size="12">🇨🇳 China (+86)</text>

  <text x="68" y="240" fill="#1d1d1f" font-size="12" font-weight="600">Phone Number</text>
  <rect x="68" y="250" width="320" height="36" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="84" y="274" fill="#1d1d1f" font-size="12">138 0013 8000</text>

  <rect x="68" y="304" width="320" height="36" rx="18" fill="#007AFF"/>
  <text x="228" y="328" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Continue</text>

  <!-- iPhone mockup (right) -->
  <rect x="448" y="78" width="200" height="296" rx="20" fill="#0a0f16" stroke="#2d3a4d" stroke-width="2"/>
  <rect x="460" y="92" width="176" height="28" rx="4" fill="#1a2433"/>
  <text x="548" y="110" fill="#e8edf4" font-size="10" text-anchor="middle">9:41 AM</text>

  <text x="548" y="148" fill="#8b9cb3" font-size="10" text-anchor="middle">Messages · Apple</text>
  <rect x="468" y="160" width="160" height="76" rx="12" fill="#2dd4bf"/>
  <text x="548" y="184" fill="#042f2e" font-size="11" font-weight="600" text-anchor="middle">您的 Apple ID 验证码：</text>
  <text x="548" y="208" fill="#042f2e" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">582 931</text>
  <text x="548" y="226" fill="#042f2e" font-size="10" text-anchor="middle">10 分钟内有效</text>

  <text x="548" y="262" fill="#8b9cb3" font-size="10" text-anchor="middle">📩 收到后立即填回网页</text>
  <text x="548" y="282" fill="#8b9cb3" font-size="10" text-anchor="middle">⏱ 30 秒后未填可点「重发」</text>
</svg>
