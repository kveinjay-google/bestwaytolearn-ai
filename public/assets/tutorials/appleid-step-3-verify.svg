<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="填写资料并验证邮箱">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 3 · 填写资料并验证邮箱</text>

  <!-- Form (Apple ID purple theme area) -->
  <rect x="48" y="80" width="624" height="280" rx="8" fill="#ffffff"/>

  <text x="68" y="108" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">📧 邮箱（已填好）</text>
  <rect x="68" y="116" width="280" height="30" rx="6" fill="#f5f5f7"/>
  <text x="80" y="136" fill="#6e6e73" font-size="11">yourname@gmail.com</text>

  <text x="380" y="108" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">🇨🇳 区域</text>
  <rect x="380" y="116" width="280" height="30" rx="6" fill="#f5f5f7"/>
  <text x="392" y="136" fill="#6e6e73" font-size="11">中国大陆（这里不动）</text>

  <text x="68" y="170" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">👤 姓氏（拼音）</text>
  <rect x="68" y="178" width="280" height="30" rx="6" fill="#f5f5f7"/>
  <text x="80" y="198" fill="#1d1d1f" font-size="11">Zhang</text>

  <text x="380" y="170" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">👤 名字（拼音）</text>
  <rect x="380" y="178" width="280" height="30" rx="6" fill="#f5f5f7"/>
  <text x="392" y="198" fill="#1d1d1f" font-size="11">San</text>

  <text x="68" y="232" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">🎂 出生日期</text>
  <rect x="68" y="240" width="592" height="30" rx="6" fill="#f5f5f7"/>
  <text x="80" y="260" fill="#6e6e73" font-size="11">1990/01/01 （需年满 18 岁）</text>

  <text x="68" y="294" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">🔒 验证邮箱 6 位验证码</text>
  <rect x="68" y="302" width="120" height="34" rx="6" fill="#ffffff" stroke="#007AFF" stroke-width="2"/>
  <text x="128" y="324" fill="#1d1d1f" font-size="14" text-anchor="middle" font-weight="700">847 392</text>

  <!-- highlight callout -->
  <rect x="200" y="304" width="200" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="324" fill="#92400e" font-size="11" text-anchor="middle" font-weight="600">📩 检查邮箱收件箱</text>

  <text x="360" y="356" fill="#6e6e73" font-size="10" text-anchor="middle">验证码 10 分钟内有效</text>
</svg>
