<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="在 iPhone 切换 App Store 账号">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 8 · iPhone 切换 App Store 账号下免费应用</text>

  <!-- iPhone frame -->
  <rect x="68" y="80" width="200" height="280" rx="20" fill="#0a0f16" stroke="#2d3a4d" stroke-width="2"/>
  <rect x="80" y="94" width="176" height="22" rx="4" fill="#1a2433"/>
  <text x="168" y="110" fill="#e8edf4" font-size="9" text-anchor="middle">9:41 AM</text>

  <!-- App Store icon -->
  <rect x="138" y="128" width="60" height="60" rx="14" fill="#007AFF"/>
  <text x="168" y="168" fill="#ffffff" font-size="28" text-anchor="middle" font-weight="700">A</text>

  <text x="168" y="208" fill="#e8edf4" font-size="11" text-anchor="middle">App Store</text>

  <text x="168" y="232" fill="#8b9cb3" font-size="9" text-anchor="middle">步骤 A: 打开 App Store</text>
  <text x="168" y="248" fill="#8b9cb3" font-size="9" text-anchor="middle">点击右上角头像</text>

  <text x="168" y="280" fill="#2dd4bf" font-size="10" text-anchor="middle">▼</text>
  <text x="168" y="302" fill="#2dd4bf" font-size="9" text-anchor="middle">步骤 B: 滑动到底部</text>
  <text x="168" y="316" fill="#2dd4bf" font-size="9" text-anchor="middle">点「Sign Out」</text>
  <text x="168" y="338" fill="#2dd4bf" font-size="10" text-anchor="middle">▼</text>

  <!-- Slide-out sheet preview -->
  <rect x="288" y="80" width="356" height="280" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="466" y="108" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" text-anchor="middle">App Store · Account</text>

  <circle cx="466" cy="138" r="18" fill="#f5f5f7"/>
  <text x="466" y="144" fill="#6e6e73" font-size="14" text-anchor="middle">👤</text>

  <text x="466" y="180" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" text-anchor="middle">yourname@gmail.com</text>
  <text x="466" y="196" fill="#6e6e73" font-size="10" text-anchor="middle">🇺🇸 Apple Media Services</text>

  <rect x="316" y="216" width="300" height="32" rx="6" fill="#f5f5f7"/>
  <text x="466" y="237" fill="#007AFF" font-size="12" text-anchor="middle" font-weight="600">使用其他 Apple ID 登录</text>

  <line x1="316" y1="260" x2="616" y2="260" stroke="#e5e5ea"/>

  <text x="338" y="282" fill="#1d1d1f" font-size="11">购买项目</text>
  <text x="338" y="304" fill="#1d1d1f" font-size="11">订阅</text>
  <text x="338" y="326" fill="#ff3b30" font-size="11" font-weight="600">登出（Sign Out）</text>

  <text x="338" y="348" fill="#5e5e63" font-size="10">ⓘ 后续切换会被以「使用其他 Apple ID」完成</text>
</svg>
