<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="完善姓名和安全问题">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 6 · 完善姓名 + 安全问题</text>

  <!-- address -->
  <rect x="48" y="80" width="320" height="280" rx="8" fill="#ffffff"/>
  <text x="68" y="108" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">📬 Billing Address (美区)</text>
  <text x="68" y="130" fill="#6e6e73" font-size="10">使用美国地址生成器，结果填入。</text>

  <text x="68" y="158" fill="#1d1d1f" font-size="11" font-weight="600">Street</text>
  <rect x="68" y="166" width="280" height="26" rx="4" fill="#f5f5f7"/>
  <text x="80" y="184" fill="#1d1d1f" font-size="11">742 Evergreen Terrace</text>

  <text x="68" y="206" fill="#1d1d1f" font-size="11" font-weight="600">City</text>
  <rect x="68" y="214" width="120" height="26" rx="4" fill="#f5f5f7"/>
  <text x="80" y="232" fill="#1d1d1f" font-size="11">Springfield</text>

  <text x="200" y="206" fill="#1d1d1f" font-size="11" font-weight="600">State</text>
  <rect x="200" y="214" width="68" height="26" rx="4" fill="#f5f5f7"/>
  <text x="212" y="232" fill="#1d1d1f" font-size="11">CA</text>

  <text x="280" y="206" fill="#1d1d1f" font-size="11" font-weight="600">ZIP</text>
  <rect x="280" y="214" width="68" height="26" rx="4" fill="#f5f5f7"/>
  <text x="292" y="232" fill="#1d1d1f" font-size="11">90210</text>

  <text x="68" y="254" fill="#1d1d1f" font-size="11" font-weight="600">Phone</text>
  <rect x="68" y="262" width="280" height="26" rx="4" fill="#f5f5f7"/>
  <text x="80" y="280" fill="#1d1d1f" font-size="11">(415) 555-2671</text>

  <rect x="68" y="306" width="280" height="32" rx="16" fill="#007AFF"/>
  <text x="208" y="328" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="600">Create Account</text>

  <!-- Security questions -->
  <rect x="388" y="80" width="284" height="280" rx="8" fill="#ffffff"/>
  <text x="408" y="108" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">🔑 Security Questions</text>
  <text x="408" y="130" fill="#6e6e73" font-size="10">务必记住，可以填虚假答案。</text>

  <text x="408" y="158" fill="#1d1d1f" font-size="11" font-weight="600">Q1</text>
  <rect x="408" y="166" width="244" height="26" rx="4" fill="#f5f5f7"/>
  <text x="420" y="184" fill="#1d1d1f" font-size="11">第一家雇主的名字？</text>

  <rect x="408" y="198" width="244" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="420" y="216" fill="#1d1d1f" font-size="11">apple</text>

  <text x="408" y="244" fill="#1d1d1f" font-size="11" font-weight="600">Q2</text>
  <rect x="408" y="252" width="244" height="26" rx="4" fill="#f5f5f7"/>
  <text x="420" y="270" fill="#1d1d1f" font-size="11">最喜欢的运动？</text>
  <rect x="408" y="284" width="244" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="420" y="302" fill="#1d1d1f" font-size="11">running</text>

  <text x="408" y="334" fill="#2dd4bf" font-size="10" font-weight="600">📌 记下来！存到备忘录</text>
</svg>
