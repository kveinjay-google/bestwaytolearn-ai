<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="同意条款并完成注册">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 7 · 同意条款并完成注册</text>

  <!-- Centered modal -->
  <rect x="148" y="80" width="424" height="290" rx="14" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>

  <text x="360" y="118" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Verify your Apple ID</text>

  <!-- Captcha -->
  <text x="180" y="156" fill="#1d1d1f" font-size="11" font-weight="600">请输入图中字符</text>
  <rect x="180" y="166" width="120" height="44" rx="6" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="240" y="198" fill="#1d1d1f" font-family="serif" font-size="22" font-style="italic" text-anchor="middle">K7p2M</text>

  <rect x="180" y="220" width="120" height="32" rx="6" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="192" y="240" fill="#1d1d1f" font-size="12">_____ 输入这里</text>

  <!-- Terms -->
  <rect x="320" y="156" width="232" height="100" rx="6" fill="#f5f5f7"/>
  <text x="332" y="178" fill="#1d1d1f" font-size="11" font-weight="600">iCloud Terms of Service</text>
  <text x="332" y="198" fill="#6e6e73" font-size="10">By tapping Create, you agree to</text>
  <text x="332" y="214" fill="#007AFF" font-size="10">our Terms of Service and Privacy</text>
  <text x="332" y="230" fill="#007AFF" font-size="10">Policy. You also agree that Apple</text>
  <text x="332" y="246" fill="#007AFF" font-size="10">may send you service notifications.</text>

  <rect x="180" y="284" width="180" height="38" rx="8" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="270" y="308" fill="#6e6e73" font-size="13" text-anchor="middle">Cancel</text>

  <rect x="372" y="284" width="180" height="38" rx="8" fill="#007AFF"/>
  <text x="462" y="308" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Create</text>

  <line x1="372" y1="284" x2="552" y2="284" stroke="#0a84ff" stroke-width="0"/>
  <text x="360" y="352" fill="#2dd4bf" font-size="10" text-anchor="middle" font-weight="600">✓ 点击 Create 后账号激活，去邮箱确认完成</text>
</svg>
