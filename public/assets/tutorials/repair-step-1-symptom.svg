<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="识别 OpenClaw 故障症状">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 1 · 识别 OpenClaw 故障症状</text>

  <!-- Top: warning banner -->
  <rect x="48" y="80" width="624" height="48" rx="8" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="64" y="106" fill="#ef4444" font-size="14" font-weight="700">⚠ OpenClaw 出问题了？</text>
  <text x="64" y="120" fill="#fca5a5" font-size="11">下面 5 个症状最常见，对号入座找解法</text>

  <!-- 5 symptom cards -->
  <rect x="48" y="142" width="300" height="100" rx="6" fill="#0a0f16" stroke="#334155"/>
  <text x="62" y="166" fill="#fb923c" font-size="12" font-weight="600">① Gateway 连接失败</text>
  <text x="62" y="186" fill="#8b9cb3" font-size="10">· 浏览器打开 127.0.0.1:18789 显示</text>
  <text x="62" y="200" fill="#8b9cb3" font-size="10">  「无法连接」</text>
  <text x="62" y="218" fill="#5eead4" font-size="10">→ 多半是服务挂了</text>

  <rect x="372" y="142" width="300" height="100" rx="6" fill="#0a0f16" stroke="#334155"/>
  <text x="386" y="166" fill="#fb923c" font-size="12" font-weight="600">② 渠道无响应</text>
  <text x="386" y="186" fill="#8b9cb3" font-size="10">· 微信/Telegram 发了消息</text>
  <text x="386" y="200" fill="#8b9cb3" font-size="10">  但 OpenClaw 不回复</text>
  <text x="386" y="218" fill="#5eead4" font-size="10">→ 渠道连接断开了</text>

  <rect x="48" y="252" width="300" height="100" rx="6" fill="#0a0f16" stroke="#334155"/>
  <text x="62" y="276" fill="#fb923c" font-size="12" font-weight="600">③ 模型调用失败</text>
  <text x="62" y="296" fill="#8b9cb3" font-size="10">· 看到 401 / 429 / 500</text>
  <text x="62" y="310" fill="#8b9cb3" font-size="10">  或 balance exhausted</text>
  <text x="62" y="328" fill="#5eead4" font-size="10">→ API key 失效/欠费/限流</text>

  <rect x="372" y="252" width="300" height="100" rx="6" fill="#0a0f16" stroke="#334155"/>
  <text x="386" y="276" fill="#fb923c" font-size="12" font-weight="600">④ 更新后变砖</text>
  <text x="386" y="296" fill="#8b9cb3" font-size="10">· openclaw update 后</text>
  <text x="386" y="310" fill="#8b9cb3" font-size="10">  服务起不来</text>
  <text x="386" y="328" fill="#5eead4" font-size="10">→ 配置分裂/版本不匹配</text>

  <text x="360" y="368" fill="#a78bfa" font-size="11" text-anchor="middle">不管哪种症状，**第 2 步起开始诊断**</text>
</svg>
