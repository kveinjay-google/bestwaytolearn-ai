<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="跳过付款方式">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 5 · 付款方式 — 选「无」跳国</text>

  <rect x="48" y="80" width="624" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68" y="106" fill="#fbbf24" font-size="13" font-weight="700">⚠ 关键：别选信用卡！</text>
  <text x="68" y="128" fill="#92400e" font-size="11">除非你真的要买美区付费 App，付款选「无」即可在 App Store 下载免费 App。</text>
  <text x="68" y="148" fill="#92400e" font-size="11">买了应用才需添加美区 PayPal / 美国信用卡 / Gift Card。</text>
  <text x="68" y="166" fill="#92400e" font-size="11">本教程仅演示「无」选项。</text>

  <!-- Payment options list -->
  <rect x="48" y="196" width="624" height="160" rx="8" fill="#ffffff"/>
  <text x="68" y="222" fill="#1d1d1f" font-family="-apple-system,sans-serif" font-size="13" font-weight="600">Billing Method</text>

  <rect x="68" y="234" width="580" height="28" rx="6" fill="#f5f5f7"/>
  <text x="84" y="252" fill="#1d1d1f" font-size="12">💳 Visa / MasterCard</text>

  <rect x="68" y="266" width="580" height="28" rx="6" fill="#f5f5f7"/>
  <text x="84" y="284" fill="#1d1d1f" font-size="12">🏦 PayPal</text>

  <rect x="68" y="298" width="580" height="32" rx="6" fill="#e7f5ff" stroke="#007AFF" stroke-width="2"/>
  <circle cx="84" cy="314" r="6" fill="#007AFF"/>
  <circle cx="84" cy="314" r="3" fill="#ffffff"/>
  <text x="104" y="320" fill="#1d1d1f" font-size="13" font-weight="600">None (跳过付款)</text>
  <text x="640" y="320" fill="#2dd4bf" font-size="13" font-weight="600" text-anchor="end">← 就选这个</text>
</svg>
