<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="验证安装成功">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 4 · 验证安装成功</text>

  <!-- Left: explain -->
  <rect x="48" y="80" width="240" height="280" rx="8" fill="#0a0f16" stroke="#334155"/>
  <text x="68" y="108" fill="#22c55e" font-size="13" font-weight="600">✅ 安装成功的标志</text>

  <text x="68" y="138" fill="#e8edf4" font-size="11">检查命令（两条任选）：</text>

  <rect x="68" y="150" width="200" height="26" rx="4" fill="#0f1620" stroke="#334155"/>
  <text x="78" y="167" fill="#fb923c" font-family="ui-monospace,monospace" font-size="11">openclaw --version</text>

  <rect x="68" y="184" width="200" height="26" rx="4" fill="#0f1620" stroke="#334155"/>
  <text x="78" y="201" fill="#fb923c" font-family="ui-monospace,monospace" font-size="11">which openclaw</text>

  <text x="68" y="232" fill="#22c55e" font-size="11" font-weight="600">应看到：</text>
  <text x="68" y="250" fill="#8b9cb3" font-size="10">• 版本号类似 2026.7.1</text>
  <text x="68" y="266" fill="#8b9cb3" font-size="10">• 路径类似 /Users/.../bin/openclaw</text>

  <text x="68" y="298" fill="#a78bfa" font-size="11">❌ 找不到命令？</text>
  <text x="68" y="314" fill="#a78bfa" font-size="10">   export PATH=$PATH:$HOME/.npm-global/bin</text>
  <text x="68" y="328" fill="#a78bfa" font-size="10">   或重开 Terminal</text>

  <!-- Right: terminal showing success -->
  <rect x="304" y="80" width="368" height="280" rx="10" fill="#0a0f16" stroke="#334155" stroke-width="1.5"/>
  <rect x="304" y="80" width="368" height="28" rx="10" fill="#1a1f2e"/>
  <circle cx="320" cy="94" r="5" fill="#ff5f57"/>
  <circle cx="336" cy="94" r="5" fill="#febc2e"/>
  <circle cx="352" cy="94" r="5" fill="#28c840"/>
  <text x="488" y="98" fill="#8b9cb3" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">zsh — terminal</text>

  <text x="320" y="138" fill="#5eead4" font-family="ui-monospace,monospace" font-size="12">$</text>
  <text x="336" y="138" fill="#e8edf4" font-family="ui-monospace,monospace" font-size="12">openclaw --version</text>

  <text x="320" y="172" fill="#fb923c" font-family="ui-monospace,monospace" font-size="13" font-weight="600">🦞 OpenClaw 2026.7.1</text>

  <text x="320" y="200" fill="#5eead4" font-family="ui-monospace,monospace" font-size="12">$</text>
  <text x="336" y="200" fill="#e8edf4" font-family="ui-monospace,monospace" font-size="12">which openclaw</text>

  <text x="320" y="232" fill="#5eead4" font-family="ui-monospace,monospace" font-size="11">/Users/kevin/.npm-global/bin/openclaw</text>

  <!-- success card -->
  <rect x="320" y="258" width="320" height="60" rx="8" fill="#0a1f12" stroke="#22c55e" stroke-width="1.5"/>
  <text x="340" y="282" fill="#22c55e" font-size="14" font-weight="600">✓ 安装成功！</text>
  <text x="340" y="304" fill="#5eead4" font-size="11">可以进入下一步启动服务</text>

  <text x="320" y="340" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">$</text>
  <rect x="338" y="330" width="10" height="14" fill="#fb923c"/>
</svg>
