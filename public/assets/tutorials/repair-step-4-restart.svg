<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="重启 gateway 服务">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 4 · 重启 Gateway 服务</text>

  <!-- Left: explain -->
  <rect x="48" y="80" width="240" height="280" rx="8" fill="#0a0f16" stroke="#334155"/>
  <text x="68" y="108" fill="#fb923c" font-size="13" font-weight="600">🔄 重启三选一</text>

  <text x="68" y="138" fill="#e8edf4" font-size="12" font-weight="600">方式 1：CLI 重启（推荐）</text>
  <rect x="68" y="150" width="200" height="28" rx="4" fill="#0f1620" stroke="#334155"/>
  <text x="78" y="169" fill="#fb923c" font-family="ui-monospace,monospace" font-size="11">openclaw gateway restart</text>

  <text x="68" y="200" fill="#e8edf4" font-size="12" font-weight="600">方式 2：Dashboard 重启</text>
  <text x="68" y="216" fill="#8b9cb3" font-size="10">Settings → Gateway → Restart 按钮</text>

  <text x="68" y="244" fill="#e8edf4" font-size="12" font-weight="600">方式 3：系统服务（macOS）</text>
  <text x="68" y="260" fill="#8b9cb3" font-size="10">launchctl unload + load</text>
  <rect x="68" y="270" width="200" height="40" rx="4" fill="#0f1620" stroke="#334155"/>
  <text x="78" y="286" fill="#5eead4" font-family="ui-monospace,monospace" font-size="9">launchctl unload ~/Library/</text>
  <text x="78" y="298" fill="#5eead4" font-family="ui-monospace,monospace" font-size="9">LaunchAgents/ai.openclaw.gateway.plist</text>

  <text x="68" y="328" fill="#a78bfa" font-size="11">⚡ 重启约 5–10 秒</text>

  <!-- Right: terminal mockup -->
  <rect x="304" y="80" width="368" height="280" rx="10" fill="#0a0f16" stroke="#334155" stroke-width="1.5"/>
  <rect x="304" y="80" width="368" height="28" rx="10" fill="#1a1f2e"/>
  <circle cx="320" cy="94" r="5" fill="#ff5f57"/>
  <circle cx="336" cy="94" r="5" fill="#febc2e"/>
  <circle cx="352" cy="94" r="5" fill="#28c840"/>
  <text x="488" y="98" fill="#8b9cb3" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">zsh — terminal</text>

  <text x="320" y="130" fill="#5eead4" font-family="ui-monospace,monospace" font-size="11">$</text>
  <text x="336" y="130" fill="#e8edf4" font-family="ui-monospace,monospace" font-size="11">openclaw gateway restart</text>

  <text x="320" y="158" fill="#fb923c" font-family="ui-monospace,monospace" font-size="10">◇ Stopping gateway...</text>
  <text x="320" y="172" fill="#5eead4" font-family="ui-monospace,monospace" font-size="10">  ✓ Stopped (pid 46130)</text>

  <text x="320" y="196" fill="#fb923c" font-family="ui-monospace,monospace" font-size="10">◇ Starting gateway...</text>
  <text x="320" y="210" fill="#5eead4" font-family="ui-monospace,monospace" font-size="10">  ✓ Started (pid 7005)</text>

  <text x="320" y="234" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="10">◇ Probing gateway...</text>
  <text x="320" y="248" fill="#22c55e" font-family="ui-monospace,monospace" font-size="10">  ✓ Reachable: yes (8ms)</text>
  <text x="320" y="262" fill="#22c55e" font-family="ui-monospace,monospace" font-size="10">  ✓ Capability: operator.read</text>

  <rect x="320" y="282" width="336" height="58" rx="6" fill="#0a1f12" stroke="#22c55e" stroke-width="1.5"/>
  <text x="338" y="304" fill="#22c55e" font-size="12" font-weight="600">✓ Gateway 重启完成</text>
  <text x="338" y="320" fill="#5eead4" font-size="10">状态 running · 端口 18789 可达</text>
  <text x="338" y="334" fill="#5eead4" font-size="10">→ 验证 step 7</text>
</svg>
