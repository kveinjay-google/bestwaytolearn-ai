<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="运行 npm install -g openclaw@latest">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 3 · 运行 npm 安装命令</text>

  <!-- Left: explain -->
  <rect x="48" y="80" width="240" height="280" rx="8" fill="#0a0f16" stroke="#334155"/>
  <text x="68" y="108" fill="#fb923c" font-size="13" font-weight="600">📦 复制粘贴命令</text>
  <text x="68" y="132" fill="#8b9cb3" font-size="11">在 Terminal 中粘贴：</text>

  <rect x="68" y="146" width="200" height="36" rx="4" fill="#0f1620" stroke="#334155"/>
  <text x="76" y="170" fill="#5eead4" font-family="ui-monospace,monospace" font-size="11">$</text>
  <text x="92" y="170" fill="#e8edf4" font-family="ui-monospace,monospace" font-size="10">npm install -g</text>
  <text x="76" y="180" fill="#fb923c" font-family="ui-monospace,monospace" font-size="10">openclaw@latest</text>

  <text x="68" y="208" fill="#5eead4" font-size="11" font-weight="600">⏎ 按下回车</text>
  <text x="68" y="226" fill="#8b9cb3" font-size="10">下载约 88MB（首次 1-3 分钟）</text>
  <text x="68" y="244" fill="#8b9cb3" font-size="10">看到一堆进度条 + 警告 OK</text>
  <text x="68" y="262" fill="#8b9cb3" font-size="10">结束时不报错 = 安装成功</text>

  <text x="68" y="296" fill="#a78bfa" font-size="11">⚠ 警告（warn）可忽略</text>
  <text x="68" y="314" fill="#a78bfa" font-size="11">⚠ 错误（error）才需处理</text>
  <text x="68" y="332" fill="#a78bfa" font-size="11">💡 需 sudo 输密码就输 Mac 开机密码</text>

  <!-- Right: terminal mockup with progress -->
  <rect x="304" y="80" width="368" height="280" rx="10" fill="#0a0f16" stroke="#334155" stroke-width="1.5"/>
  <rect x="304" y="80" width="368" height="28" rx="10" fill="#1a1f2e"/>
  <circle cx="320" cy="94" r="5" fill="#ff5f57"/>
  <circle cx="336" cy="94" r="5" fill="#febc2e"/>
  <circle cx="352" cy="94" r="5" fill="#28c840"/>
  <text x="488" y="98" fill="#8b9cb3" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">zsh — terminal</text>

  <text x="320" y="130" fill="#5eead4" font-family="ui-monospace,monospace" font-size="12">$</text>
  <text x="334" y="130" fill="#e8edf4" font-family="ui-monospace,monospace" font-size="12">npm install -g openclaw@latest</text>

  <text x="320" y="160" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">npm warn deprecated ...</text>
  <text x="320" y="178" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">npm warn deprecated ...</text>

  <text x="320" y="208" fill="#fb923c" font-family="ui-monospace,monospace" font-size="11">⏳ reify:openclaw ..................  </text>
  <rect x="320" y="220" width="280" height="6" rx="3" fill="#1e293b"/>
  <rect x="320" y="220" width="200" height="6" rx="3" fill="#fb923c"/>

  <text x="320" y="248" fill="#5eead4" font-family="ui-monospace,monospace" font-size="11">added 56 packages in 38s</text>

  <text x="320" y="280" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">$</text>
  <rect x="338" y="270" width="10" height="14" fill="#fb923c"/>
</svg>
