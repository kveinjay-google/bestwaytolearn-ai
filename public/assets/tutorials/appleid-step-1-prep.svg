<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="准备注册所需信息">
  <rect width="720" height="400" rx="12" fill="#0b1118"/>
  <rect x="24" y="24" width="672" height="352" rx="8" fill="#111820" stroke="#2d3a4d" stroke-width="1.5"/>
  <text x="48" y="58" fill="#8b9cb3" font-family="system-ui,sans-serif" font-size="13">步骤 1 · 准备注册所需信息</text>

  <!-- Left side: Checklist -->
  <rect x="48" y="80" width="320" height="280" rx="8" fill="#0a0f16" stroke="#334155"/>
  <text x="68" y="110" fill="#e8edf4" font-size="14" font-weight="600">📋 注册前清单</text>

  <text x="68" y="148" fill="#2dd4bf" font-size="13" font-weight="600">✓ 一个未注册过 Apple ID 的邮箱</text>
  <text x="88" y="166" fill="#8b9cb3" font-size="11">推荐 Gmail / Outlook / iCloud</text>

  <text x="68" y="196" fill="#2dd4bf" font-size="13" font-weight="600">✓ 可接收短信的手机号</text>
  <text x="88" y="214" fill="#8b9cb3" font-size="11">仅用于验证，不会扣费</text>

  <text x="68" y="244" fill="#2dd4bf" font-size="13" font-weight="600">✓ 稳定网络（建议美国节点）</text>
  <text x="88" y="262" fill="#8b9cb3" font-size="11">美区页面仅向北美 IP 开放</text>

  <text x="68" y="292" fill="#5eead4" font-size="13" font-weight="600">⚠ 不要使用已注册的邮箱</text>
  <text x="88" y="310" fill="#8b9cb3" font-size="11">否则会与已有账号绑定失败</text>

  <text x="68" y="340" fill="#a78bfa" font-size="11">📌 美国地址生成器：usaddress.dumbcoding.com</text>

  <!-- Right side: iPhone status hint -->
  <rect x="392" y="100" width="260" height="240" rx="20" fill="#1a2433" stroke="#2d3a4d" stroke-width="2"/>
  <rect x="404" y="120" width="236" height="32" rx="6" fill="#0a0f16"/>
  <text x="498" y="140" fill="#e8edf4" font-size="11" text-anchor="middle">9:41 AM · 5G</text>
  <text x="610" y="140" fill="#2dd4bf" font-size="11" text-anchor="middle">●●●●</text>

  <text x="522" y="200" fill="#e8edf4" font-size="22" font-weight="700" text-anchor="middle">Apple ID</text>
  <text x="522" y="230" fill="#8b9cb3" font-size="12" text-anchor="middle">注册前准备就绪</text>

  <circle cx="522" cy="280" r="32" fill="rgba(45, 212, 191, 0.12)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="522" y="290" fill="#2dd4bf" font-size="28" text-anchor="middle">✓</text>
</svg>
