<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="ai-flow-title ai-flow-desc">
  <title id="ai-flow-title">AI 工作原理示意图</title>
  <desc id="ai-flow-desc">从数据训练到 Transformer 与大语言模型，再到用户获得 AI 回答的完整流程，以及 AI 包含机器学习与深度学习的层级关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="19" fill="none" stroke="rgba(45,212,191,0.22)" stroke-width="2"/>

  <text x="600" y="44" text-anchor="middle" fill="#e8edf4" font-family="Outfit, sans-serif" font-size="28" font-weight="600">AI 是如何工作的？</text>
  <text x="600" y="72" text-anchor="middle" fill="#8b9cb3" font-family="Outfit, sans-serif" font-size="15">数据学习规律 → 模型理解语言 → 你提问 → AI 生成回答</text>

  <!-- Main pipeline (steps 1-5) -->
  <g font-family="Outfit, sans-serif">
    <rect x="48" y="118" width="150" height="88" rx="12" fill="#141b26" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <text x="123" y="152" text-anchor="middle" fill="#2dd4bf" font-size="15" font-weight="600">① 海量数据</text>
    <text x="123" y="176" text-anchor="middle" fill="#8b9cb3" font-size="12">网页 · 书籍 · 代码</text>
    <text x="123" y="194" text-anchor="middle" fill="#5a6d85" font-size="11">训练语料</text>

    <line x1="198" y1="162" x2="238" y2="162" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="238" y="118" width="170" height="88" rx="12" fill="#141b26" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <text x="323" y="148" text-anchor="middle" fill="#2dd4bf" font-size="15" font-weight="600">② 神经网络训练</text>
    <text x="323" y="172" text-anchor="middle" fill="#8b9cb3" font-size="12">ML → DL · 反向传播</text>
    <text x="323" y="190" text-anchor="middle" fill="#5a6d85" font-size="11">从数据中发现规律</text>

    <line x1="408" y1="162" x2="448" y2="162" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="448" y="104" width="190" height="116" rx="12" fill="#141b26" stroke="rgba(167,139,250,0.45)" stroke-width="2" filter="url(#glow)"/>
    <text x="543" y="136" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="600">③ Transformer</text>
    <text x="543" y="160" text-anchor="middle" fill="#e8edf4" font-size="13">自注意力机制</text>
    <text x="543" y="182" text-anchor="middle" fill="#8b9cb3" font-size="12">并行处理整句上下文</text>
    <text x="543" y="204" text-anchor="middle" fill="#5a6d85" font-size="11">现代 LLM 的核心架构</text>

    <line x1="638" y1="162" x2="678" y2="162" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="678" y="104" width="190" height="116" rx="12" fill="#141b26" stroke="rgba(245,158,11,0.45)" stroke-width="2"/>
    <text x="773" y="136" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="600">④ 大语言模型 LLM</text>
    <text x="773" y="160" text-anchor="middle" fill="#e8edf4" font-size="13">预测下一个词元</text>
    <text x="773" y="182" text-anchor="middle" fill="#8b9cb3" font-size="12">预训练 → 微调 → RLHF</text>
    <text x="773" y="204" text-anchor="middle" fill="#5a6d85" font-size="11">学会语言与知识</text>

    <line x1="868" y1="162" x2="908" y2="162" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="908" y="118" width="150" height="88" rx="12" fill="#141b26" stroke="rgba(45,212,191,0.35)" stroke-width="1.5"/>
    <text x="983" y="148" text-anchor="middle" fill="#2dd4bf" font-size="15" font-weight="600">⑤ 你提问</text>
    <text x="983" y="172" text-anchor="middle" fill="#8b9cb3" font-size="12">提示词 Prompt</text>
    <text x="983" y="190" text-anchor="middle" fill="#5a6d85" font-size="11">ChatGPT / Claude…</text>

    <line x1="983" y1="206" x2="983" y2="224" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Nested hierarchy -->
  <g font-family="Outfit, sans-serif">
    <text x="80" y="348" fill="#8b9cb3" font-size="14" font-weight="600">概念层级（由大到小）</text>

    <rect x="80" y="368" width="420" height="112" rx="14" fill="none" stroke="rgba(45,212,191,0.25)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="108" y="398" fill="#2dd4bf" font-size="14" font-weight="600">AI 人工智能</text>
    <text x="220" y="398" fill="#5a6d85" font-size="11">Artificial Intelligence</text>

    <rect x="108" y="410" width="364" height="58" rx="12" fill="rgba(45,212,191,0.06)" stroke="rgba(45,212,191,0.2)" stroke-width="1"/>
    <text x="132" y="436" fill="#f59e0b" font-size="13" font-weight="600">ML 机器学习</text>
    <text x="240" y="436" fill="#5a6d85" font-size="11">Machine Learning</text>

    <rect x="132" y="448" width="316" height="32" rx="10" fill="rgba(167,139,250,0.1)" stroke="rgba(167,139,250,0.25)" stroke-width="1"/>
    <text x="156" y="468" fill="#a78bfa" font-size="13" font-weight="600">DL 深度学习</text>
    <text x="260" y="468" fill="#5a6d85" font-size="11">Deep Learning · 多层神经网络</text>
  </g>

  <!-- LLM inference loop (left of step 6, no overlap) -->
  <g font-family="IBM Plex Mono, monospace">
    <text x="560" y="348" fill="#8b9cb3" font-size="14" font-weight="600" font-family="Outfit, sans-serif">推理时发生了什么？</text>
    <rect x="560" y="368" width="300" height="112" rx="14" fill="#141b26" stroke="rgba(45,212,191,0.22)" stroke-width="1.5"/>
    <text x="576" y="394" fill="#8b9cb3" font-size="11" font-family="Outfit, sans-serif">输入：</text>
    <text x="616" y="394" fill="#e8edf4" font-size="11" font-family="IBM Plex Mono, monospace">"请解释什么是 RAG"</text>
    <text x="576" y="418" fill="#8b9cb3" font-size="11" font-family="Outfit, sans-serif">模型：</text>
    <text x="616" y="418" fill="#2dd4bf" font-size="10" font-family="IBM Plex Mono, monospace">逐词元算概率 → 选下一词</text>
    <text x="576" y="442" fill="#8b9cb3" font-size="11" font-family="Outfit, sans-serif">输出：</text>
    <text x="616" y="442" fill="#e8edf4" font-size="10" font-family="IBM Plex Mono, monospace">"RAG 先查资料再回答…"</text>
    <rect x="576" y="454" width="268" height="22" rx="6" fill="rgba(251,113,133,0.1)" stroke="rgba(251,113,133,0.3)" stroke-width="1"/>
    <text x="588" y="469" fill="#fb7185" font-size="9" font-family="Outfit, sans-serif">注意：可能幻觉 · 知识有截止日期</text>
  </g>

  <!-- Step 6: drawn last so it stays above lower panels -->
  <g font-family="Outfit, sans-serif">
    <rect x="878" y="224" width="210" height="72" rx="12" fill="url(#teal)" opacity="0.18" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="888" y="232" width="190" height="56" rx="10" fill="#141b26" stroke="rgba(45,212,191,0.5)" stroke-width="1.5"/>
    <text x="983" y="260" text-anchor="middle" fill="#2dd4bf" font-size="16" font-weight="600">⑥ AI 生成回答</text>
    <text x="983" y="278" text-anchor="middle" fill="#8b9cb3" font-size="12">文本 · 代码 · 图像 · 音频</text>
  </g>

  <text x="600" y="502" text-anchor="middle" fill="#5a6d85" font-size="11" font-family="Outfit, sans-serif">下方 8 个模块按此知识链展开 · 点击标题可折叠/展开</text>
</svg>